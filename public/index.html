<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>My E-Commerce Store</title><style>body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }header { display: flex; justify-content: space-between; align-items: center; background: #333; color: white; padding: 10px 20px; border-radius: 5px; }h1 { margin: 0; font-size: 24px; }.cart-info { font-size: 18px; background: #007bff; padding: 8px 15px; border-radius: 5px; }.product-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }.card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 200px; text-align: center; }button { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; }button:hover { background: #218838; }.checkout-container { text-align: center; margin-top: 40px; }.checkout-btn { background: #ffc107; color: black; font-weight: bold; padding: 12px 30px; font-size: 16px; }</style></head><body><header><h1>My College E-Commerce Store</h1><div class="cart-info">Cart: <span id="cart-count">0</span> items</div></header><div class="product-container" id="product-list"></div><div class="checkout-container"><button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button></div><script>let cartCount = 0; async function loadProducts() { const response = await fetch("/api/products"); const products = await response.json(); const container = document.getElementById("product-list"); container.innerHTML = ""; products.forEach(product => { const div = document.createElement("div"); div.className = "card"; div.innerHTML = `<h3>${product.name}</h3><p>Price: Rs. ${product.price}</p><button onclick="addToCart()">Add to Cart</button>`; container.appendChild(div); }); } function addToCart() { cartCount++; document.getElementById("cart-count").innerText = cartCount; } function checkout() { if (cartCount === 0) { alert("Your cart is empty! Add some items first."); } else { alert(`Order placed successfully for ${cartCount} item(s)! Thank you for shopping.`); cartCount = 0; document.getElementById("cart-count").innerText = cartCount; } } loadProducts();</script></body></html>
